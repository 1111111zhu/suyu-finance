<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="mint">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SEEEX 薪资 · 连续画布示例</title><link rel="icon" href="../设计资产/图标/flower.svg" type="image/svg+xml"><link rel="stylesheet" href="../样式/foundations.css"><link rel="stylesheet" href="../样式/components.css"><link rel="stylesheet" href="../样式/canvases.css"><link rel="stylesheet" href="../样式/motion.css"><link rel="stylesheet" href="../样式/payroll.css"><script type="module" src="payroll.js"></script></head>
<body class="payroll-page ui-canvas ui-canvas--floral">
  <a class="ui-skip" href="#payroll-main">跳到工资内容</a>
  <div class="payroll-shell" data-section="salary">
    <aside class="payroll-sidebar"><a class="payroll-brand" href="../index.html" aria-label="SEEEX 设计规范">SEEEX</a><nav class="payroll-nav" aria-label="主导航"><button data-section="salary" aria-current="page" aria-label="本月工资"><span data-icon="calendar"></span><span class="nav-label">本月工资</span></button><button data-section="history" aria-label="历史批次"><span data-icon="clock"></span><span class="nav-label">历史批次</span></button><button data-section="email" aria-label="邮件发送"><span data-icon="mail"></span><span class="nav-label">邮件发送</span></button><button data-section="settings" aria-label="核算设置"><span data-icon="settings"></span><span class="nav-label">核算设置</span></button><a href="../index.html" aria-label="首页"><span data-icon="home"></span><span class="nav-label">首页</span></a></nav><div class="payroll-sidebar-footer"><div class="ui-row"><span class="ui-avatar">Z</span><button class="ui-button ui-button--ghost ui-button--icon" data-theme-toggle aria-label="切换深色主题"><span data-icon="moon"></span></button></div><a href="../index.html">← 返回规范设计</a></div></aside>
    <main class="payroll-center" id="payroll-main"><div class="payroll-steps"><nav id="payroll-flow" aria-label="算薪步骤"></nav></div><div id="payroll-content"></div><footer class="payroll-footer"><span>交互示例 · 不进行真实工资核算</span><div class="ui-row"><button class="ui-text-action" id="load-demo">载入示例资料</button><button class="ui-text-action ui-muted" id="reset-demo">重置</button></div></footer></main>
    <aside class="payroll-context" aria-label="核算概况"><div><p class="ui-eyebrow" id="phase-label">第一阶段</p><h2 id="context-title">应发核算</h2><p class="period" id="context-period"></p></div><hr><dl class="ui-keyvalue"><div><dt>员工范围</dt><dd id="context-people">—</dd></div><div><dt id="context-material-label">工资资料</dt><dd id="context-materials">0 / 5</dd></div><div><dt>计薪天数</dt><dd id="context-days">待填写</dd></div></dl><hr><div class="payroll-progress-area"><div class="ui-space-between ui-caption"><span>完成进度</span><span id="context-percent" class="ui-number">0%</span></div><div class="ui-progress" id="context-progress"><div class="ui-progress-fill"></div></div></div><div><button class="ui-button ui-button--pill payroll-context-action" id="context-next" disabled>计算并核对应发 <span data-icon="arrow"></span></button><p class="payroll-context-note" id="context-note">填写天数，并准备好工资资料</p></div></aside>
  </div>
  <dialog class="ui-dialog ui-drawer" id="review-drawer" aria-labelledby="review-title"><div class="ui-dialog-head"><h2 id="review-title"></h2><button class="ui-button ui-button--ghost ui-button--icon" data-close-dialog aria-label="关闭工资明细"><span data-icon="close"></span></button></div><div class="ui-dialog-body"><p class="ui-caption" id="review-meta"></p><hr><dl class="ui-keyvalue" id="review-values"></dl><hr><button class="ui-button ui-button--accent" id="review-confirm">确认已核对 <span data-icon="check"></span></button></div></dialog>
</body></html>
