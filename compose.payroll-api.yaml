# Merge with compose.payroll-db.yaml using the SAME project name as the database.
# Migrations, owner/bootstrap and restricted runtime role are provisioned first.
services:
  payroll-api:
    build:
      context: .
      dockerfile: server/payroll/Dockerfile
    restart: unless-stopped
    env_file:
      - ${PAYROLL_API_ENV_FILE:?Set the absolute private API environment file path}
    environment:
      NODE_ENV: production
      PAYROLL_API_HOST: 0.0.0.0
      PAYROLL_API_PORT: 3002
    ports:
      - "127.0.0.1:${PAYROLL_API_HOST_PORT:-3002}:3002"
    depends_on:
      payroll-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:3002/api/payroll/health',{signal:AbortSignal.timeout(4000)});process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
