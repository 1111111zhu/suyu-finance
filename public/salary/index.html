<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动算薪系统 · Demo</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-blue: #f0f5ff;
      --text: #172033;
      --text-2: #6b768c;
      --text-3: #9aa5b6;
      --line: #e6ebf2;
      --line-strong: #d4dce8;
      --brand: #2764e8;
      --brand-2: #174fc7;
      --brand-soft: #eaf1ff;
      --green: #14966f;
      --green-soft: #e8f8f1;
      --orange: #c97410;
      --orange-soft: #fff4df;
      --red: #d84545;
      --red-soft: #fff0f0;
      --shadow: 0 12px 32px rgba(42, 61, 91, .06);
      --shadow-sm: 0 2px 8px rgba(42, 61, 91, .06);
      --radius: 12px;
      --radius-sm: 8px;
      --sidebar: 238px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; }
    .sidebar { width: var(--sidebar); flex: 0 0 var(--sidebar); background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 14px 16px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 24px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #4a86ff, #2357d8); color: #fff; display: grid; place-items: center; box-shadow: 0 7px 16px rgba(39,100,232,.24); }
    .brand-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: .2px; }
    .brand-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .nav-section { margin: 7px 0 8px; padding: 0 12px; color: #a0a9b8; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .nav-btn { border: 0; background: transparent; color: var(--text-2); border-radius: 9px; text-align: left; padding: 10px 12px; display: flex; align-items: center; gap: 11px; transition: .16s ease; }
    .nav-btn:hover { background: var(--surface-blue); color: var(--brand); }
    .nav-btn.active { color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .nav-icon { width: 18px; height: 18px; display: grid; place-items: center; color: currentColor; }
    .nav-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 10px 0; }
    .role-card { background: #f7f9fd; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 9px; }
    .avatar { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: #d9e7ff; color: #2954a4; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .role-title { font-size: 12px; font-weight: 700; }
    .role-meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .main { min-width: 0; flex: 1; }
    .topbar { height: 68px; padding: 0 32px; background: rgba(255,255,255,.86); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
    .crumb { color: var(--text-3); font-size: 13px; }
    .crumb strong { color: var(--text); font-weight: 700; margin-left: 5px; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .batch-pill { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; padding-right: 16px; border-right: 1px solid var(--line); }
    .dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 4px var(--green-soft); }
    .icon-btn { border: 0; background: transparent; color: var(--text-2); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--surface-soft); color: var(--brand); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .content { max-width: 1400px; margin: 0 auto; padding: 30px 34px 54px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .page-title { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 780; letter-spacing: -.025em; }
    .page-subtitle { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
    .page-actions { display: flex; align-items: center; gap: 10px; }
    .btn { border: 1px solid var(--line-strong); color: var(--text-2); background: #fff; padding: 9px 14px; border-radius: 8px; font-weight: 650; font-size: 13px; transition: .16s ease; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
    .btn:hover { border-color: #a9b9d0; color: var(--text); background: #fbfcfe; }
    .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 4px 10px rgba(39,100,232,.18); }
    .btn-primary:hover { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
    .btn-success { background: var(--green); color: #fff; border-color: var(--green); }
    .btn-danger { color: var(--red); border-color: #f3c9c9; background: var(--red-soft); }
    .btn-sm { font-size: 12px; padding: 6px 10px; }
    .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .card-pad { padding: 20px; }
    .stat-card { padding: 18px 20px; position: relative; overflow: hidden; }
    .stat-card::after { content: ""; position: absolute; width: 80px; height: 80px; border-radius: 50%; right: -25px; top: -29px; background: var(--surface-blue); opacity: .75; }
    .stat-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .stat-value { margin-top: 10px; font-size: 26px; line-height: 1; font-weight: 780; letter-spacing: -.03em; position: relative; z-index: 1; }
    .stat-value em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--text-2); margin-left: 3px; letter-spacing: 0; }
    .stat-foot { margin-top: 12px; color: var(--text-3); font-size: 11px; position: relative; z-index: 1; }
    .stat-foot.good { color: var(--green); }
    .stat-foot.warn { color: var(--orange); }
    .section-card { margin-top: 20px; }
    .section-head { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .section-title { font-size: 15px; font-weight: 760; }
    .section-desc { color: var(--text-3); font-size: 12px; margin-top: 3px; }
    .section-body { padding: 20px; }
    .hero { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(300px,.65fr); gap: 16px; }
    .hero-card { padding: 26px; border-radius: var(--radius); background: linear-gradient(135deg, #2463e9, #467ff2); color: #fff; min-height: 222px; position: relative; overflow: hidden; box-shadow: 0 14px 30px rgba(39,100,232,.18); }
    .hero-card::before, .hero-card::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; }
    .hero-card::before { width: 340px; height: 340px; right: -100px; top: -175px; }
    .hero-card::after { width: 250px; height: 250px; right: -60px; bottom: -195px; }
    .eyebrow { color: rgba(255,255,255,.73); font-size: 12px; letter-spacing: .08em; font-weight: 700; }
    .hero-title { font-size: 24px; font-weight: 780; margin: 9px 0 8px; letter-spacing: -.025em; }
    .hero-copy { color: rgba(255,255,255,.82); font-size: 13px; max-width: 430px; line-height: 1.7; }
    .hero-bottom { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
    .hero-bottom .btn { color: #1f58d4; background: #fff; border-color: #fff; box-shadow: none; }
    .hero-note { color: rgba(255,255,255,.66); font-size: 11px; }
    .status-card { padding: 22px; display: flex; flex-direction: column; justify-content: space-between; min-height: 222px; }
    .status-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .status-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
    .status-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .status-label { color: var(--text-2); font-size: 12px; }
    .status-value { font-size: 19px; font-weight: 760; margin-top: 4px; }
    .status-copy { color: var(--text-2); font-size: 12px; line-height: 1.7; margin-top: 20px; }
    .progress { height: 7px; border-radius: 99px; overflow: hidden; background: #edf1f6; margin-top: 12px; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--green); width: 100%; }
    .flow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .flow-step { flex: 1; min-width: 0; padding: 15px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
    .flow-step.current { background: var(--brand-soft); border-color: #c9d9ff; }
    .flow-step.done { background: var(--green-soft); border-color: #c9eedf; }
    .flow-index { color: var(--text-3); font-size: 11px; font-weight: 750; }
    .flow-step.current .flow-index { color: var(--brand); }
    .flow-step.done .flow-index { color: var(--green); }
    .flow-name { margin-top: 5px; font-size: 13px; font-weight: 720; }
    .flow-desc { margin-top: 2px; color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-arrow { color: #bcc6d5; flex: 0 0 16px; text-align: center; }
    .flow-arrow svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .formula-card { background: #18253a; border: 0; color: #eaf1ff; }
    .formula-card .section-title { color: #fff; }
    .formula-card .section-desc { color: #9aaac2; }
    .formula-card .section-head { border-color: rgba(255,255,255,.1); }
    .formula-list { display: grid; gap: 0; grid-template-columns: repeat(2,1fr); }
    .formula-item { padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,.09); display: flex; gap: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .formula-item:nth-child(odd) { border-right: 1px solid rgba(255,255,255,.09); }
    .formula-no { color: #8eb0ff; font-weight: 700; }
    .formula-text { color: #dbe6f7; }
    .formula-text strong { color: #fff; font-weight: 700; }
    .dashboard-lower { display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; }
    .bar-row { display: grid; grid-template-columns: 64px 1fr 72px; align-items: center; gap: 10px; margin: 13px 0; font-size: 12px; }
    .bar-label { color: var(--text-2); }
    .bar-track { height: 9px; border-radius: 99px; background: #eef2f7; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #477ff1, #7da1f6); }
    .bar-value { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
    .exception { display: flex; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .exception:last-child { border-bottom: 0; }
    .exception-mark { width: 25px; height: 25px; flex: 0 0 25px; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .exception-title { font-weight: 700; font-size: 12px; }
    .exception-copy { color: var(--text-2); font-size: 11px; margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.blue { color: var(--brand); background: var(--brand-soft); }
    .badge.orange { color: var(--orange); background: var(--orange-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .stepper { display: flex; align-items: center; padding: 15px 18px; margin-bottom: 20px; background: #fff; border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow-sm); }
    .step-item { display: flex; align-items: center; gap: 9px; color: var(--text-3); font-size: 12px; font-weight: 700; cursor: pointer; }
    .step-item .step-num { width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; color: var(--text-3); font-size: 11px; }
    .step-item.done, .step-item.active { color: var(--brand); }
    .step-item.done .step-num { border-color: #a9d9c8; background: var(--green-soft); color: var(--green); }
    .step-item.active .step-num { border-color: var(--brand); background: var(--brand); color: #fff; }
    .step-line { flex: 1; height: 1px; background: var(--line); margin: 0 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .select, .input { border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--text); height: 36px; padding: 0 11px; outline: 0; font-size: 12px; }
    .input { min-width: 220px; }
    .select:focus, .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; width: 15px; height: 15px; left: 10px; top: 10px; color: var(--text-3); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .search-wrap .input { padding-left: 32px; }
    .source-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .source-card { border: 1px solid var(--line); border-radius: 10px; padding: 15px; background: #fff; min-height: 148px; transition: .16s ease; }
    .source-card:hover { border-color: #b9c9e6; box-shadow: var(--shadow-sm); }
    .source-head { display: flex; align-items: flex-start; gap: 10px; }
    .source-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); flex: 0 0 34px; }
    .source-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .source-name { font-weight: 760; font-size: 13px; }
    .source-meta { margin-top: 3px; color: var(--text-3); font-size: 11px; }
    .source-status { margin: 17px 0 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .source-filename { color: var(--text-2); max-width: 175px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-error { color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 5px 7px; margin: -3px 0 9px; font-size: 11px; line-height: 1.35; }
    .upload-zone { border: 1px dashed #bfd0ec; border-radius: 10px; padding: 28px; text-align: center; color: var(--text-2); background: #fbfdff; }
    .upload-zone { cursor: pointer; }
    .upload-zone:focus-visible, .upload-zone.drag-over { outline: 2px solid var(--brand); background: #eef4ff; }
    .upload-zone[aria-disabled="true"] { cursor: wait; opacity: .65; }
    .import-review { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; }
    .import-review-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .import-review-row > div { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
    .import-review-row select { max-width: 100%; }
    .source-filename { overflow-wrap: anywhere; }
    .upload-zone svg { width: 27px; height: 27px; color: var(--brand); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .upload-zone-title { margin-top: 8px; font-weight: 700; color: var(--text); }
    .upload-zone-copy { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .upload-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 17px; border-top: 1px solid var(--line); }
    .muted { color: var(--text-3); font-size: 12px; }
    .mapping-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin-bottom: 16px; }
    .mapping-stat { padding: 15px 16px; border: 1px solid var(--line); background: var(--surface-soft); border-radius: 10px; }
    .mapping-stat-label { color: var(--text-2); font-size: 12px; }
    .mapping-stat-value { font-size: 24px; margin-top: 6px; font-weight: 780; }
    .mapping-stat-note { color: var(--text-3); font-size: 11px; margin-top: 3px; }
    .map-table, .data-table { width: 100%; border-collapse: collapse; }
    .map-table th, .map-table td, .data-table th, .data-table td { padding: 11px 13px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .map-table th, .data-table th { background: #f8fafc; color: var(--text-2); font-size: 11px; font-weight: 760; }
    .map-table td, .data-table td { font-size: 12px; }
    .map-table tr:last-child td, .data-table tr:last-child td { border-bottom: 0; }
    .map-table .field { font-weight: 700; }
    .map-table .source-field { color: var(--text-2); }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .data-table th { position: sticky; top: 0; z-index: 1; }
    .data-table tbody tr:hover td { background: #fbfdff; }
    .data-table .name-cell { color: var(--brand); font-weight: 750; cursor: pointer; }
    .data-table .name-cell:hover { text-decoration: underline; }
    .amount { font-variant-numeric: tabular-nums; text-align: right !important; }
    .amount.strong { font-weight: 760; color: var(--text); }
    .amount.net { font-weight: 800; color: var(--brand); }
    .exception-row td { background: #fffaf4; }
    .table-footer { padding-top: 15px; display: flex; align-items: center; justify-content: space-between; color: var(--text-2); font-size: 12px; }
    .pagination { display: flex; gap: 5px; }
    .page-btn { min-width: 28px; height: 28px; padding: 0 7px; border: 1px solid var(--line); background: #fff; border-radius: 6px; color: var(--text-2); font-size: 12px; }
    .page-btn.active { color: #fff; border-color: var(--brand); background: var(--brand); }
    .page-btn:disabled { color: #c1c9d5; cursor: default; }
    .alert { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0; padding: 11px 13px; border-radius: 8px; font-size: 12px; }
    .alert.orange { background: var(--orange-soft); color: #8e5b1b; }
    .alert svg { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .slip-layout { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 20px; align-items: start; }
    .slip-paper { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); padding: 28px 30px; }
    .slip-top { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .slip-company { font-size: 18px; font-weight: 780; }
    .slip-period { color: var(--text-2); font-size: 12px; margin-top: 4px; }
    .slip-person { text-align: right; }
    .slip-person-name { font-size: 20px; font-weight: 800; }
    .slip-person-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .slip-groups { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; margin-top: 20px; }
    .slip-group { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .slip-group.final { grid-column: 1 / -1; background: #f9fbff; border-color: #d6e1f8; }
    .slip-group-title { color: var(--brand); font-size: 12px; font-weight: 800; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .slip-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 12px; border-bottom: 1px dashed #edf0f4; }
    .slip-row:last-child { border-bottom: 0; }
    .slip-row span:first-child { color: var(--text-2); }
    .slip-row span:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .slip-row.key { margin: 4px -4px -3px; padding: 10px 4px; border-radius: 7px; background: var(--brand-soft); }
    .slip-row.key span:last-child { font-size: 16px; color: var(--brand); }
    .side-panel { padding: 18px; }
    .side-label { font-size: 11px; color: var(--text-2); font-weight: 700; margin-bottom: 7px; }
    .side-panel .select { width: 100%; }
    .mini-kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }

    const profiles = [
      {id:'SY001', name:'张三', company:'溯驭技术', dept:'技术部', subdept:'电控组', status:'在职', join:'2023-03-01', leave:'', base:8000, post:3000, perfBase:2000, score:.9, meal:500, transit:200, otherAllow:0, otherAdd:0, sick:2, personal:1, absent:0, social:1200, fund:600, otherDeduct:0, utility:0, mealDeduct:0},

      {id:'SY005', name:'陈七', company:'溯驭技术', dept:'技术部', subdept:'测试组', status:'入职', join:'2025-01-18', leave:'', base:6000, post:2000, perfBase:1000, score:.9, meal:250, transit:100, otherAllow:0, otherAdd:0, sick:0, personal:0, absent:0, social:600, fund:300, otherDeduct:0, utility:0, mealDeduct:0},
      {id:'SY006', name:'周八', company:'溯驭技术', dept:'销售部', subdept:'华东区', status:'离职', join:'2022-06-09', leave:'2025-01-15', base:5500, post:2000, perfBase:1000, score:.8, meal:200, transit:150, otherAllow:0, otherAdd:0, sick:0, personal:0, absent:1, social:650, fund:325, otherDeduct:0, utility:0, mealDeduct:0}

    const deptCounts = Object.fromEntries(deptPlan.map(x => [x[0], 0]));

        const i = profiles.length + 1;

        profiles.push({id:`SY${String(i).padStart(3,'0')}`, name:`员工${i}`, company:'溯驭技术', dept, subdept:sub, status:'在职', join:'2023-01-10', leave:'', base, post, perfBase, score:.85 + (i%4)*.05, meal:150 + (i%3)*50, transit:100, otherAllow:0, otherAdd:i%10===0?200:0, sick:i%13===0?1:0, personal:i%11===0?1:0, absent:0, social, fund:Math.round((base+post)*.07/50)*50, otherDeduct:0, utility:i%7===0?80:0, mealDeduct:i%5===0?120:0, exception:''});
        deptCounts[dept]++;

    // 示例数据也显式提供实发薪天数；正式数据仅从考勤表读取。

    function parseDate(value) { return value ? new Date(value + 'T00:00:00') : null; }
    function isWeekday(date) { const d = date.getDay(); return d !== 0 && d !== 6; }
    function weekdaysBetween(start, end) {
      if (!start || !end) return 0;
      let count = 0, cursor = new Date(start);
      const last = new Date(end);
      while (cursor <= last) { if (isWeekday(cursor)) count++; cursor.setDate(cursor.getDate() + 1); }
      return count;
    }
    function validPayrollSettings(month, days) {
      return /^\d{4}-(0[1-9]|1[0-2])$/.test(month) && Number(month.slice(0,4)) > 0 && String(days).trim() !== '' && Number.isFinite(Number(days)) && Number(days) > 0 && Number(days) <= new Date(Number(month.slice(0,4)), Number(month.slice(5)), 0).getDate();
    }
    function monthWorkdays(month) {

    }
    function isLateHire(profile, month) { return profile.status === '入职' && profile.join && profile.join.slice(0,7) === month && Number(profile.join.slice(8,10)) >= 15; }
    function num(v) { return Number.isFinite(Number(v)) ? Number(v) : 0; }
    function calcSalary(profile, month=currentMonth, workdays=currentWorkdays) {
      if (!validPayrollSettings(month, workdays)) throw new Error('请选择计薪月份，并输入大于 0 且不超过当月日历天数的应发薪天数');
      workdays = Number(workdays);
      const exceptions = [...(profile.exception ? [profile.exception] : []), ...(profile.paidDayIssues || [])];
      const rawDays = profile.actualPaidDays;
      const validDays = (typeof rawDays === 'number' || (typeof rawDays === 'string' && /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(rawDays.trim()))) && Number.isFinite(Number(rawDays)) && Number(rawDays) >= 0;
      const payrollBlocked = !validDays; // 仅表示此人工资相关结果待核对，不限制导出。
      if (!validDays) exceptions.push('考勤表“实发薪天数”缺失或无效，请填写非负数（允许 0 和小数）');
      const payableDays = payrollBlocked ? null : Number(rawDays);
      const hasDeductibleLeave = [profile.sick, profile.personal, profile.absent].some(value => num(value) !== 0);
      const deductDays = payrollBlocked ? null : hasDeductibleLeave ? 21.75 - payableDays : 0;
      const late = isLateHire(profile, month);
      const perfScore = late ? 0 : num(profile.score);
      const performancePay = num(profile.perfBase) * perfScore;
      const subtotal = num(profile.base) + num(profile.post) + performancePay;
      const sickSubsidy = 2660 / 21.75 * num(profile.sick) * .8;
      const attendanceDeduct = payrollBlocked ? null : subtotal / 21.75 * deductDays;
      const gross = payrollBlocked ? null : subtotal + num(profile.meal) + num(profile.transit) + num(profile.otherAllow) + sickSubsidy + num(profile.otherAdd) - attendanceDeduct - num(profile.otherReduction);
      const social = num(profile.social), fund = num(profile.fund), otherDeduct = num(profile.otherDeduct), utility = num(profile.utility), mealDeduct = num(profile.mealDeduct);
      const net = payrollBlocked ? null : gross - social - fund - otherDeduct - utility - mealDeduct;
      return {...profile, otherReduction:num(profile.otherReduction), otherDeduct, workdays, payableDays, payrollBlocked, deductDays, effectiveScore: perfScore, performancePay, subtotal, sickSubsidy, attendanceDeduct, gross, social, fund, net, late, hasException: exceptions.length > 0, exception: exceptions.join('；')};

    const today = new Date();
    let currentMonth = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    let currentWorkdays = 22; // 初始示例天数；实际算薪由用户填写。
    let employees = profiles.map(p => calcSalary(p, currentMonth));
    let sourceRows = {};
    const state = {
      view: 'overview',
      sourceStatus: Object.fromEntries(sourceSheets.map(s => [s.key, {uploaded:true, filename:`${s.name}.xlsx`, rows:s.rows, demo:true} ])),
      liveImport: false,
      calculated: true,
      calculating: false,
      page: 1,
      pageSize: 8,
      search: '',
      dept: '全部部门',
      company: '全部公司',
      status: '全部状态',
      selectedId: 'SY001',
      batches: [
        {name:monthLabel(currentMonth)+'工资批次', month:currentMonth, workdays:currentWorkdays, status:'已计算', employees:80, sources:9, date:'2025-01-28', active:true},

ct class="select" id="statusFilter"><option>全部状态</option><option ${state.status==='在职'?'selected':''}>在职</option><option ${state.status==='入职'?'selected':''}>入职</option><option ${state.status==='离职'?'selected':''}>离职</option></select></div><div class="toolbar-right"><span class="muted" id="resultRange">${state.liveImport?'导入数据':'示例数据'} ${total?start+1:0}–${Math.min(start+rows.length,total)} / ${total}</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>序号</th><th>姓名</th><th>部门</th><th>状态</th><th class="amount">工资小计</th><th class="amount">应发工资</th><th class="amount">个人社保</th><th class="amount">公积金</th><th class="amount">假勤扣款</th><th class="amount">实发工资</th><th class="amount">年假天数</th><th class="amount">弹性假天数</th><th class="amount">调休假天数</th><th class="amount">病假天数</th><th class="amount">事假天数</th><th class="amount">旷工天数</th><th class="amount">公司缴纳（公积金）</th><th class="amount">公司总计（社保）</th></tr></thead><tbody id="resultTbody">${rows.map((e,i)=>resultRow(e,start+i)).join('')}</tbody></table></div><div class="table-footer"><span id="exceptionBanner">${exceptionText}</span><div class="pagination" id="pagination">${pagination(total)}</div></div></div></div>`;

    function resultRow(e, index) { return `<tr class="${e.hasException?'exception-row':''}"><td>${index+1}</td><td class="name-cell" data-employee="${e.id}">${e.name}${e.hasException?' <span class="badge orange">异常</span>':''}</td><td>${e.dept}</td><td><span class="badge ${e.status==='在职'?'green':e.status==='入职'?'blue':'orange'}">${e.status}</span></td><td class="amount strong">${money(e.subtotal)}</td><td class="amount strong">${money(e.gross)}</td><td class="amount">${e.social?money(e.social):'—'}</td><td class="amount">${money(e.fund)}</td><td class="amount">${money(e.attendanceDeduct)}</td><td class="amount net">${money(e.net)}</td><td class="amount">${num(e.annual)}</td><td class="amount">${num(e.flexible)}</td><td class="amount">${num(e.compensatory)}</td><td class="amount">${num(e.sick)}</td><td class="amount">${num(e.personal)}</td><td class="amount">${num(e.absent)}</td><td class="amount">${money(num(e.companyFund))}</td><td class="amount">${money(num(e.companySocial))}</td></tr>`; }

y(e.gross))}${row('个人社保',`-${money(e.social)}`)}${row('个人公积金',`-${money(e.fund)}`)}${row('其他代扣',`-${money(e.otherDeduct)}`)}${row('员工宿舍水电费代扣',`-${money(e.utility)}`)}${row('餐费代扣',`-${money(e.mealDeduct)}`)}${row('实发工资',money(e.net),'key')}${row('公司缴纳（公积金）',money(num(e.companyFund)))}${row('公司总计（社保）',money(num(e.companySocial)))}</div></div></div><aside class="card side-panel"><div class="side-label">选择员工</div><select class="select" id="slipEmployee">${employees.slice(0,12).map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.name} · ${x.dept}</option>`).join('')}</select><div class="mini-kpi"><div class="mini-kpi-item"><div class="mini-kpi-label">工资小计</div><div class="mini-kpi-value">${money(e.subtotal)}</div></div><div class="mini-kpi-item"><div class="mini-kpi-label">实发工资</div><div class="mini-kpi-value" style="color:var(--brand)">${money(e.net)}</div></div><div class="mini-kpi-item"><div class="mini-kpi-label">假勤扣薪天数</div><div class="mini-kpi-value">${integer(e.deductDays)} 天</div></div><div class="mini-kpi-item"><div class="mini-kpi-label">绩效分数</div><div class="mini-kpi-value">${e.effectiveScore.toFixed(2)}</div></div></div><hr class="side-divider"><div class="side-label">计算说明</div><div class="side-note">${e.late?'该员工入职日期为 '+e.join+'，按规则入职日在计薪月 15 号（含）之后，绩效分数自动设为 0。<br><br>':''}${leaveRuleNote}${e.hasException?'<br><br>异常：'+e.exception+'。实发薪天数无效或姓名重复时仅记录异常，不限制导出，其余缺失数值按 0 参与计算。':''}</div><hr class="side-divider"><button class="btn" style="width:100%" data-go="results">返回工资明细表</button></aside></div>`;
    }
    function renderBatches() {
      return `${setPageHead('batches','<button class="btn btn-primary" data-new-batch>'+icon.plus+' 新建批次</button>')}<div class="card"><div class="section-head"><div><div class="section-title">算薪批次列表</div><div class="section-desc">每个计薪周期独立保存源表、映射配置与计算结果</div></div><div class="search-wrap">${icon.search}<input class="input" placeholder="搜索批次…" id="batchSearch" /></div></div><div class="section-body"><div class="batch-list" id="batchList">${state.batches.map((b,i)=>`<div class="batch-row" data-batch-row data-name="${b.name}"><div><div class="batch-name">${b.name} ${b.active?'<span class="badge blue">当前批次</span>':''}</div><div class="batch-meta">创建人：计划员 · ${b.date}</div></div><div><div class="batch-stat-label">状态</div><div class="batch-stat-value"><span class="badge ${b.status==='已计算'?'green':'blue'}">${b.status}</span></div></div><div><div class="batch-stat-label">员工人数</div><div class="batch-stat-value">${b.employees} 人</div></div><div><div class="batch-stat-label">源表 / 月份</div><div class="batch-stat-value">${b.sources} 张 · ${b.month}</div></div><div class="batch-actions"><button class="btn btn-sm" data-batch-open="${i}">查看明细</button>${b.active?`<button class="btn btn-sm" data-batch-rerun>重算</button>`:''}<button class="btn btn-sm" data-batch-export>导出</button></div></div>`).join('')}</div></div></div>`;

    function bindView() {
      content.querySelector('#payrollSettings')?.addEventListener('submit', event=>{event.preventDefault();applyPayrollSettings(content.querySelector('#payrollYear').value+'-'+content.querySelector('#payrollMonth').value,content.querySelector('#payrollDays').value);});
      content.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.go==='mapping'&&!hasPayrollRoster()){showToast('请先上传花名册以确定员工范围');return;}render(el.dataset.go);}));
      content.querySelectorAll('[data-step-view]').forEach(el=>el.addEventListener('click',()=>render(el.dataset.stepView)));
      content.querySelectorAll('[data-upload]').forEach(btn=>btn.addEventListener('click',()=>document.getElementById('file-'+btn.dataset.upload).click()));
      content.querySelectorAll('[data-source-input]').forEach(input=>input.addEventListener('change',()=>handleSourceInput(input)));
      const bulk=content.querySelector('#bulk-source-input'), zone=content.querySelector('[data-bulk-upload]');
      const choose=()=>{if(!importSession().busy) bulk?.click();};
      zone?.addEventListener('click',choose);
      zone?.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});
      zone?.addEventListener('dragover',event=>{event.preventDefault();if(!importSession().busy) zone.classList.add('drag-over');});
      zone?.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
      zone?.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('drag-over');importFiles(event.dataTransfer.files);});
      bulk?.addEventListener('change',()=>importFiles(bulk.files));
      content.querySelectorAll('[data-import-target]').forEach(select=>select.addEventListener('change',()=>{importSession().items[Number(select.dataset.importTarget)].key=select.value;}));
      content.querySelectorAll('[data-import-confirm]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.importConfirm);const key=content.querySelector(`[data-import-target="${index}"]`).value;if(!key){showToast('请先选择目标模块');return;}resolveImport(index,key);}));
      content.querySelectorAll('[data-import-dismiss]').forEach(button=>button.addEventListener('click',()=>{if(importSession().busy)return;importSession().items.splice(Number(button.dataset.importDismiss),1);render('upload');}));
      const calc=content.querySelector('[data-calculate]'); if(calc) calc.addEventListener('click',()=>{if(!hasPayrollRoster()){showToast('请先上传花名册以确定员工范围');return;}state.calculating=true;render('mapping');setTimeout(()=>{recalculateEmployees();state.calculating=false;state.calculated=true;currentBatch().status='已计算';render('results');showToast(`计算完成：${missingSourceSheets().length} 张未上传源表已按 0 处理`);},900);});
      const save=content.querySelector('[data-save-template]'); if(save) save.addEventListener('click',()=>showToast('已保存为“默认模板 V1 · 副本”'));
      const exp=content.querySelector('[data-export]'); if(exp) exp.addEventListener('click',()=>downloadCsv());
      const exps=content.querySelector('[data-export-slip]'); if(exps) exps.addEventListener('click',()=>downloadSlip());
      const print=content.querySelector('[data-print]'); if(print) print.addEventListener('click',()=>{if(payrollExportReady()) window.print();});
      const slipSelect=content.querySelector('#slipEmployee'); if(slipSelect) slipSelect.addEventListener('change',()=>{state.selectedId=slipSelect.value;render('slip');});
      content.querySelectorAll('[data-employee]').forEach(el=>el.addEventListener('click',()=>{state.selectedId=el.dataset.employee;render('slip');}));
      const search=content.querySelector('#resultSearch'); if(search) search.addEventListener('input',()=>{state.search=search.value;state.page=1;updateResultTable();});
      const dept=content.querySelector('#deptFilter'); if(dept) dept.addEventListener('change',()=>{state.dept=dept.value;state.page=1;updateResultTable();});
      const status=content.querySelector('#statusFilter'); if(status) status.addEventListener('change',()=>{state.status=status.value;state.page=1;updateResultTable();});
      content.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(filterEmployees().length/state.pageSize)); if(btn.dataset.page==='prev')state.page=Math.max(1,state.page-1);else if(btn.dataset.page==='next')state.page=Math.min(pages,state.page+1);else state.page=Number(btn.dataset.page);updateResultTable();}));
      const batchSearch=content.querySelector('#batchSearch'); if(batchSearch) batchSearch.addEventListener('input',()=>{const q=batchSearch.value.toLowerCase();content.querySelectorAll('[data-batch-row]').forEach(row=>row.style.display=row.dataset.name.toLowerCase().includes(q)?'grid':'none');});
      content.querySelectorAll('[data-batch-open]').forEach(btn=>btn.addEventListener('click',()=>{const b=state.batches[Number(btn.dataset.batchOpen)];setCurrentBatch(b);render('results');}));
      content.querySelectorAll('[data-batch-rerun]').forEach(btn=>btn.addEventListener('click',()=>{recalculateEmployees();render();showToast('重算完成，结果已更新');}));
      content.querySelectorAll('[data-batch-export]').forEach(btn=>btn.addEventListener('click',()=>downloadCsv()));
      content.querySelector('[data-new-batch]')?.addEventListener('click',openModal);
      content.querySelector('[data-new-template]')?.addEventListener('click',()=>showToast('新建模板向导已打开（Demo）'));
      content.querySelectorAll('[data-template-action]').forEach(btn=>btn.addEventListener('click',()=>showToast(`${btn.dataset.templateAction}操作已触发`)));
    }
    function updateResultTable() {
      const filtered=filterEmployees(), start=(state.page-1)*state.pageSize, rows=filtered.slice(start,start+state.pageSize);
      const tbody=document.getElementById('resultTbody'); if(tbody) tbody.innerHTML=rows.map((e,i)=>resultRow(e,start+i)).join('');
      const count=document.getElementById('resultCount'); if(count) count.textContent=`筛选出 ${filtered.length} 条示例记录`;
      const range=document.getElementById('resultRange'); if(range) range.textContent=`${state.liveImport?'导入数据':'示例数据'} ${filtered.length?start+1:0}–${Math.min(start+rows.length,filtered.length)} / ${filtered.length}`;
      const pag=document.getElementById('pagination'); if(pag){pag.innerHTML=pagination(filtered.length);pag.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(filterEmployees().length/state.pageSize));if(btn.dataset.page==='prev')state.page=Math.max(1,state.page-1);else if(btn.dataset.page==='next')state.page=Math.min(pages,state.page+1);else state.page=Number(btn.dataset.page);updateResultTable();}));}
      document.querySelectorAll('[data-employee]').forEach(el=>el.addEventListener('click',()=>{state.selectedId=el.dataset.employee;render('slip');}));
    }
    function openModal(){ document.getElementById('batchMonth').value=currentMonth; document.getElementById('batchName').value=monthLabel(currentMonth)+'工资批次'; document.getElementById('batchDays').value=''; document.getElementById('batchModal').classList.remove('hidden'); }
    function closeModal(){ document.getElementById('batchModal').classList.add('hidden'); }
    function download(filename, content, type='text/csv;charset=utf-8') { const blob=new Blob(['\ufeff'+content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
    function payrollExportReady() {
      if (state.liveImport) recalculateEmployees();
      if (!employees.length) { showToast('没有可导出的员工，请先上传花名册'); return false; }
      return true;
    }
    function workbookReady() { if (!payrollExportReady()) return false; if (!window.XLSX) { showToast('Excel 组件尚未加载，请稍候重试'); return false; } return true; }
    function downloadXlsx(workbook, filename) { const bytes=window.XLSX.write(workbook,{bookType:'xlsx',type:'array'}); const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
    function exportHeaders() { return ['姓名','公司','一级部门','二级部门','银行卡号','开户行','是否入离职','入职日期','离职日期','应发薪','实发薪天数','基本工资','岗位工资','绩效基数','绩效分数','绩效工资','工资小计','餐饮津贴','交通津贴','其他津贴','病假补贴','其他加','年假天数','弹性假天数','调休假天数','病假天数','事假天数','旷工天数','假勤扣薪天数','假勤扣款','其他减','应发工资','个人社保','个人公积金','其他代扣','员工宿舍水电费代扣','餐费代扣','实发工资','公司缴纳','公司总计']; }
    function exportRow(e) { return [e.name,e.company,e.dept,e.subdept,e.bankCard||'',e.bankName||'',e.statusRaw ?? e.status, (e.joinRaw ?? e.join) || '', (e.leaveRaw ?? e.leave) || '',e.workdays,e.payableDays,e.base,e.post,e.perfBase,e.effectiveScore,e.performancePay,e.subtotal,e.meal,e.transit,e.otherAllow,e.sickSubsidy,e.otherAdd,num(e.annual),num(e.flexible),num(e.compensatory),e.sick,e.personal,e.absent,e.deductDays,e.attendanceDeduct,e.otherReduction,e.gross,e.social??'',e.fund,e.otherDeduct,e.utility,e.mealDeduct,e.net,num(e.companyFund),num(e.companySocial)]; }
    function detailSheet() { const headers=exportHeaders(), groups=new Array(headers.length).fill(''); groups[0]='第 1 组 · 基础人事信息';groups[9]='第 2 组 · 薪资基准天数';groups[11]='第 3 组 · 工资类核算';groups[17]='第 4 组 · 津贴补贴';groups[22]='第 5 组 · 假期';groups[28]='第 6 组 · 扣减';groups[31]='第 7 组 · 最终核算'; const ws=window.XLSX.utils.aoa_to_sheet([groups,headers,...employees.map(exportRow)]); ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:0,c:9},e:{r:0,c:10}},{s:{r:0,c:11},e:{r:0,c:16}},{s:{r:0,c:17},e:{r:0,c:21}},{s:{r:0,c:22},e:{r:0,c:27}},{s:{r:0,c:28},e:{r:0,c:30}},{s:{r:0,c:31},e:{r:0,c:39}}]; employees.forEach((e,i)=>{if(e.hasException){const key='A'+(i+3);ws[key]=ws[key]||{t:'s',v:e.name||''};ws[key].c=[{a:'算薪异常',t:[...(e.paidDayIssues||[]),e.exception].filter(Boolean).join('；')}];}}); ws['!cols']=headers.map((_,i)=>({wch:i<9?15:13})); return ws; }
    function summarySheet() { const byDept=new Map(); employees.forEach(e=>{const item=byDept.get(e.dept)||{count:0,subtotal:0,gross:0,social:0,fund:0,net:0};item.count++;item.subtotal+=e.subtotal;item.gross=item.gross===null || e.gross===null?null:item.gross+e.gross;item.social+=e.social||0;item.fund+=e.fund||0;item.net=item.net===null || e.net===null?null:item.net+e.net;byDept.set(e.dept,item);}); const rows=[['部门','人数','工资小计合计','应发工资合计','社保合计','公积金合计','实发工资合计'],...Array.from(byDept,([dept,v])=>[dept,v.count,v.subtotal,v.gross,v.social,v.fund,v.net]),['合计',employees.length,...employees.reduce((a,e)=>[a[0]+e.subtotal,a[1]===null || e.gross===null?null:a[1]+e.gross,a[2]+(e.social||0),a[3]+(e.fund||0),a[4]===null || e.net===null?null:a[4]+e.net],[0,0,0,0,0])]]; const ws=window.XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:16},{wch:10},{wch:16},{wch:16},{wch:14},{wch:14},{wch:16}]; return ws; }
    function downloadCsv(){ if(!workbookReady()) return; const workbook=window.XLSX.utils.book_new();window.XLSX.utils.book_append_sheet(workbook,detailSheet(),'工资明细表');window.XLSX.utils.book_append_sheet(workbook,summarySheet(),'汇总统计');downloadXlsx(workbook,`工资明细表_${currentBatch().month}.xlsx`);showToast('工资明细表已导出为 Excel（明细 + 汇总）'); }
    function downloadSlip(){ if(!workbookReady()) return; const e=employees.find(x=>x.id===state.selectedId)||employees[0];const rows=[['工资条',monthLabel(currentMonth)],['员工',e.name],['工号',e.id],['公司',e.company],['一级部门',e.dept],['二级部门',e.subdept],[],['第 2 组 · 薪资基准天数','数值'],['应发薪',e.workdays],['实发薪天数',e.payableDays],['入离职状态',e.status],['绩效处理',e.late?'入职 15 号后 · 绩效归零':'正常参与'],[],['第 3 组 · 工资类核算','金额'],['基本工资',e.base],['岗位工资',e.post],['绩效工资',e.performancePay],['工资小计',e.subtotal],[],['第 4 组 · 津贴补贴','金额'],['餐饮津贴',e.meal],['交通津贴',e.transit],['其他津贴',e.otherAllow],['病假补贴',e.sickSubsidy],['其他加',e.otherAdd],[],['第 5 / 6 组 · 假期与扣减','数值'],['年假天数',num(e.annual)],['弹性假天数',num(e.flexible)],['调休假天数',num(e.compensatory)],['病假天数',num(e.sick)],['事假天数',num(e.personal)],['旷工天数',num(e.absent)],['假勤扣薪天数',e.deductDays],['假勤扣款',e.attendanceDeduct],['其他减',e.otherReduction],[],['第 7 组 · 最终核算','金额'],['应发工资',e.gross],['个人社保',e.social??0],['个人公积金',e.fund],['其他代扣',e.otherDeduct],['员工宿舍水电费代扣',e.utility],['餐费代扣',e.mealDeduct],['实发工资',e.net],['公司缴纳',num(e.companyFund)],['公司总计',num(e.companySocial)]]; const workbook=window.XLSX.utils.book_new();const ws=window.XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:25},{wch:24}];window.XLSX.utils.book_append_sheet(workbook,ws,'工资条');downloadXlsx(workbook,`工资条_${e.name}_${currentBatch().month}.xlsx`);showToast('工资条已导出为 Excel'); }
    document.querySelectorAll('.nav').forEach(nav=>nav.addEventListener('click',e=>{const btn=e.target.closest('[data-view]');if(btn)render(btn.dataset.view);}));
    document.getElementById('closeModal').addEventListener('click',closeModal); document.getElementById('cancelModal').addEventListener('click',closeModal); document.getElementById('batchModal').addEventListener('click',e=>{if(e.target.id==='batchModal')closeModal();});
    document.getElementById('batchForm').addEventListener('submit',e=>{e.preventDefault();const month=document.getElementById('batchMonth').value,name=document.getElementById('batchName').value,company=document.getElementById('batchCompany').value;const workdays=document.getElementById('batchDays').value;if(!validPayrollSettings(month,workdays)){showToast('应发薪天数须大于 0 且不超过当月日历天数');return;}const b={name,month,workdays:Number(workdays),status:'待上传',employees:0,sources:0,date:new Date().toISOString().slice(0,10),company,active:false};state.batches.unshift(b);setCurrentBatch(b);sourceRows={};state.liveImport=false;state.sourceStatus=Object.fromEntries(sourceSheets.map(s=>[s.key,{uploaded:false,filename:''}]));closeModal();render('upload');showToast(`${name} 已创建，请上传源表`);});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
    render('overview');
  </script>
