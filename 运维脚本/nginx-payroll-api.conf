# Include INSIDE the website's existing HTTPS server {} block.
# Keep the original website locations/upstream unchanged.
location ^~ /api/payroll/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Override incoming client headers. The API accepts X-Real-IP only from an
    # exact socket address listed in PAYROLL_TRUSTED_PROXIES.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_buffering off;
}
