name: Payroll server compute release
on:
  push:
    branches: [codex/payroll-compute-fix-20261010, codex/payroll-live-source-sync-20261010]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy the reviewed payroll patch to the current finance server
permissions:
  contents: read
concurrency:
  group: payroll-server-compute-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:payroll-compute
      - run: npx eslint server/payroll/calculation-*.mjs app/api/payroll/calculations public/salary/workbench-compute.js 自动化测试/payroll-computation-api.test.mjs 自动化脚本/verify-payroll-server.mjs public/salary/email-page.js
      - run: bash -n 运维脚本/deploy-payroll-compute.sh
      - run: RD_LOCAL_PREVIEW=1 npm run build
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the current finance server
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SERVER_HOST" == 123.207.188.183 ]] || { echo 'Production secrets point to a different server. No files were uploaded or changed.' >&2; exit 1; }
          [[ "$SERVER_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$SERVER_SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Production SSH configuration is incomplete.' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/finance_deploy
          chmod 600 ~/.ssh/finance_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload the verified patch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/finance_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "$SERVER_USER@$SERVER_HOST" 'test -d /opt/suyu-finance/current/dist && systemctl is-active --quiet suyu-finance'
          git archive --format=tar.gz -o "/tmp/suyu-payroll-compute-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          scp -i ~/.ssh/finance_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "/tmp/suyu-payroll-compute-${GITHUB_SHA}.tar.gz" "$SERVER_USER@$SERVER_HOST:/tmp/"
      - name: Back up and activate payroll patch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/finance_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "$SERVER_USER@$SERVER_HOST" 'sudo -n bash -s' -- "$GITHUB_SHA" < 运维脚本/deploy-payroll-compute.sh
      - name: Verify public login protection
        run: |
          code=$(curl --max-time 20 --silent -o /dev/null -w '%{http_code}' https://finance.seeextech.com/api/payroll/calculations/00000000-0000-0000-0000-000000000000)
          test "$code" = 401
